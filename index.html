<script>
    function filterVideos() {
        let input = document.getElementById('searchBox').value.toUpperCase();
        let cards = document.getElementsByClassName('card');

        for (let i = 0; i < cards.length; i++) {
            let titleElement = cards[i].querySelector('.section-title');
            if (titleElement) {
                let titleText = titleElement.innerText || titleElement.textContent;
                
                /* This stops the Welcome Card from disappearing! */
                if (titleText.toUpperCase().indexOf("WELCOME") > -1) {
                    continue; 
                }
                
                /* This hides or shows the video cards based on the search */
                if (titleText.toUpperCase().indexOf(input) > -1) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    }
    </script>
