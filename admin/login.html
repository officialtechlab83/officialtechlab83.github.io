<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechLab CMS Login</title>

<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0f172a;
}
.login-box{
    width:420px;
    background:#1e293b;
    padding:40px;
    border-radius:18px;
    text-align:center;
}
.login-box h1{
    margin-bottom:10px;
}
.login-box p{
    color:#94a3b8;
    margin-bottom:30px;
}
#loginBtn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}
</style>

</head>

<body>

<div class="login-box">

<h1>TechLab CMS</h1>

<p>Administrator Login</p>

<button id="loginBtn">

<i class="fa-brands fa-google"></i>

Login with Google

</button>

</div>

<script type="module" src="../js/auth.js"></script>

</body>
</html>
