<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Step-by-Step Guides | TechLab</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .header-content .logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .guides-intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .guides-intro h2 {
            color: #e0c25a;
            margin-bottom: 10px;
        }

        .guides-intro p {
            color: #ccc;
            font-size: 16px;
        }

        #guideSearch {
            width: 100%;
            padding: 14px;
            margin-bottom: 30px;
            border-radius: 8px;
            border: 2px solid #e0c25a;
            background-color: #121a3a;
            color: white;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        .guide-card {
            background: linear-gradient(
                135deg,
                #1f2a5c 0%,
                #121a3a 100%
            );

            border: 1px solid #e0c25a;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .guide-card h3 {
            color: #e0c25a;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .guide-meta {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .guide-card p {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .read-guide {
            display: inline-block;
            background-color: #e0c25a;
            color: #121a3a;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            transition: 0.2s;
        }

        .read-guide:hover {
            opacity: 0.85;
        }

        .no-guides {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }

        .loading-guides {
            text-align: center;
            color: #aaa;
            padding: 40px;
        }

    </style>

</head>


<body>

<header>

    <div class="header-content">

        <img src="logo.png"
             alt="TechLab Logo"
             class="logo">

        <div>

            <h1 id="siteTitle">
                TECHLAB
            </h1>

            <div class="subtitle">
                Step-by-Step Guides
            </div>

        </div>

    </div>

</header>


<div class="container">

    <a href="index.html"
       style="
       display:block;
       background-color:#121a3a;
       color:#e0c25a;
       border:1px solid #e0c25a;
       text-decoration:none;
       padding:15px 20px;
       border-radius:8px;
       font-weight:600;
       font-size:18px;
       margin-bottom:25px;
       text-align:center;
       ">
        Back to Home
    </a>


    <div class="guides-intro">

        <h2>
            Step-by-Step Guides
        </h2>

        <p>
            Practical tech guides with clear instructions,
            screenshots and useful links.
        </p>

    </div>


    <input
        type="text"
        id="guideSearch"
        placeholder="Search for a guide..."
    >


    <div id="guidesList">

        <div class="loading-guides">
            Loading guides...
        </div>

    </div>


    <footer>

        <div style="margin-bottom:10px;">
            &copy; 2026 TechLab. All Rights Reserved.
        </div>

        <div>

            <a href="https://www.youtube.com/@Techlab8"
               target="_blank"
               style="color:#e0c25a;text-decoration:none;font-size:18px;margin:0 10px;font-weight:600;">
                YouTube
            </a>

            <a href="https://www.instagram.com/tech.lab8/"
               target="_blank"
               style="color:#e0c25a;text-decoration:none;font-size:18px;margin:0 10px;font-weight:600;">
                Instagram
            </a>

            <a href="https://t.me/techlabyoutube"
               target="_blank"
               style="color:#e0c25a;text-decoration:none;font-size:18px;margin:0 10px;font-weight:600;">
                Telegram
            </a>

            <a href="mailto:officialtechlab83@gmail.com"
               style="color:#e0c25a;text-decoration:none;font-size:18px;margin:0 10px;font-weight:600;">
                Email
            </a>

        </div>

    </footer>

</div>


<script type="module">

    import { db } from "./js/firebase.js";

    import {
        collection,
        getDocs,
        query,
        orderBy
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const guidesList =
        document.getElementById("guidesList");

    const searchBox =
        document.getElementById("guideSearch");


    let allGuides = [];


    // ==========================================
    // LOAD GUIDES FROM FIRESTORE
    // ==========================================

    async function loadGuides() {

        try {

            const snapshot =
                await getDocs(

                    query(
                        collection(db, "guides"),
                        orderBy("created", "desc")
                    )

                );


            allGuides = [];


           snapshot.forEach(documentData => {

    const guide = documentData.data();

    if (guide.status === "published") {

        allGuides.push({

            id: documentData.id,

            ...guide

        });

    }

});


            renderGuides(allGuides);

        }

        catch (error) {

            console.error(
                "Unable to load guides:",
                error
            );

            guidesList.innerHTML = `

                <div class="no-guides">
                    Unable to load guides.
                </div>

            `;

        }

    }


    // ==========================================
    // RENDER GUIDES
    // ==========================================

    function renderGuides(guides) {

        guidesList.innerHTML = "";


        if (guides.length === 0) {

            guidesList.innerHTML = `

                <div class="no-guides">
                    No guides found.
                </div>

            `;

            return;

        }


        guides.forEach(guide => {

            const card =
                document.createElement("div");

            card.className =
                "guide-card";


            card.innerHTML = `

                <h3>
                    ${escapeHtml(
                        guide.title || "Untitled Guide"
                    )}
                </h3>


                <div class="guide-meta">

                    TechLab
                    •
                    ${escapeHtml(
                        guide.readTime || "5 min read"
                    )}

                </div>


                <p>

                    ${escapeHtml(
                        guide.description ||
                        "No description available."
                    )}

                </p>


                <a
                    href="guide.html?id=${guide.id}"
                    class="read-guide"
                >

                    Read Guide →

                </a>

            `;


            guidesList.appendChild(card);

        });

    }


    // ==========================================
    // SEARCH
    // ==========================================

    searchBox.addEventListener(
        "input",
        function () {

            const searchText =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allGuides.filter(guide => {

                    const title =
                        (
                            guide.title || ""
                        ).toLowerCase();

                    const description =
                        (
                            guide.description || ""
                        ).toLowerCase();


                    return (
                        title.includes(searchText) ||
                        description.includes(searchText)
                    );

                });


            renderGuides(filtered);

        }
    );


    // ==========================================
    // BASIC HTML ESCAPE
    // ==========================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    // ==========================================
    // START
    // ==========================================

    loadGuides();

</script>


</body>

</html>
