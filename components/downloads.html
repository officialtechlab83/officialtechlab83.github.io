<div class="page-header">

    <h2>Download Manager</h2>

    <button id="addDownloadBtn" class="primary-btn">
        <i class="fa-solid fa-plus"></i>
        Add Download
    </button>

</div>

<div class="table-container">

<table class="video-table">

<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Category</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="downloadTable">

<tr>
<td colspan="4" style="text-align:center;padding:40px;">
No downloads yet
</td>
</tr>

</tbody>

</table>

</div>

<div id="downloadModal" class="modal hidden">

<div class="modal-box">

<h2>Add Download</h2>

<input id="downloadTitle" placeholder="Title">

<input id="downloadUrl" placeholder="Download URL">

<input id="downloadCategory" placeholder="Category">

<textarea
id="downloadDescription"
placeholder="Description"></textarea>

<div style="display:flex;gap:10px;justify-content:flex-end;">

<button id="cancelDownload" class="primary-btn">
Cancel
</button>

<button id="saveDownload" class="primary-btn">
Publish
</button>

</div>

</div>

</div>
